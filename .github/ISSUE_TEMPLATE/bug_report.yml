name: Bug Report
description: Report a bug, false positive detection, or budget regression in Chaff
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Chaff. Please provide detailed reproduction steps.
  - type: input
    id: chaff-version
    attributes:
      label: Chaff Version & Component
      placeholder: e.g. @chaff/cli 0.1.0, GitHub Action, @chaff/mcp
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug or false positive detection.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction Steps
      placeholder: |
        1. Run `npx chaff audit`
        2. Encounter error on file `app/page.tsx`
    validations:
      required: true
